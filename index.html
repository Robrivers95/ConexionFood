<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Productos China - control de ideas, compras, inventario, comparativas y ventas." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <title>Productos China</title>
</head>
<body>
  <div class="demo-banner">Vista de demostración · datos de ejemplo · los cambios se pierden al recargar. No captures información real ni claves API todavía.</div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">中</div>
        <div><strong>Productos China</strong><span>Importación · Stock · Ventas</span></div>
      </div>
      <nav id="mainNav" class="nav"></nav>
      <div class="sidebar-footer">
        <div class="user-chip"><div class="avatar">RR</div><div><strong>Roberto</strong><span>Administrador</span></div></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menuBtn" aria-label="Abrir menú">☰</button>
        <div><p class="eyebrow" id="eyebrow">OPERACIÓN</p><h1 id="pageTitle">Dashboard</h1></div>
        <div class="top-actions">
          <button class="ghost-btn" id="quickIdeaBtn">＋ Nueva idea</button>
          <button class="primary-btn" id="quickProductBtn">＋ Producto</button>
        </div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <div class="mobile-nav" id="mobileNav"></div>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>

  <script src="app.js"></script>
</body>
</html>
